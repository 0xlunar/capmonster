[package]
name = "capmonster"
version = "0.2.0"
edition = "2024"
repository = "https://github.com/0xlunar/capmonster"
description = "Capmonster.cloud implementation in Rust"
license = "GPL-3.0"

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["time"] }
wreq = { version = "0.16.1", features = ["json"] }
log = "0.4.34"

