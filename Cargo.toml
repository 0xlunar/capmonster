[package]
name = "capmonster"
version = "0.1.0"
edition = "2021"
repository = "https://github.com/0xlunar/capmonster"
description = "Capmonster.cloud implementation in Rust"
license = "GPL-3.0"

[features]
default = ["reqwest"]
reqwest = ["dep:reqwest"]
rquest = ["dep:rquest"]

[dependencies]
anyhow = "1.0.93"
num-traits = "0.2.19"
reqwest = { version = "0.12.9", features = ["json"], optional = true }
rquest = { version = "0.27.6", features = ["json"], optional = true }
serde = { version = "1.0.215", features = ["derive"] }
serde_json = "1.0.133"
thiserror = "2.0.3"
tokio = { version = "1.41.1", features = ["time"] }

